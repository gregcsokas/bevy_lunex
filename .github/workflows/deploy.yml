name: Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Install Git LFS
        run: |
          git lfs pull
      
      - name: Install mdbook
        env:
          # Pin the mdbook version for reproducible builds (admonitions are natively supported since 0.5)
          MDBOOK_VERSION: v0.5.4
        run: |
          url="https://github.com/rust-lang/mdbook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH

      - name: Build Book
        run: |
          cd docs
          mdbook build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/book'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4